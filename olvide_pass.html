<!DOCTYPE html>
<html lang="es">
<head>

<body class="nuevo-fondo">

    <div class="card">
        <h2>Recuperar Contraseña</h2>

        </form>

        <p class="links">
            <a href="index_admin.html">Volver para iniciar sesión</a>
        </p>
    </div>
