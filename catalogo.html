<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Catálogo - Rayo 95 Motors</title>
    
    <link rel="stylesheet" href="css/estilos.css">
</head>
<body class="body-catalogo">

    
    <header class="header-catalogo">
        <img src="imagenes/Logo Rayo 95 motors.png" alt="Rayo 95 Motors Logo" class="logo-esquina">
    </header>

    <!-- 2. Contenido Principal -->
    <main class="main-catalogo">
        <h1 class="titulo-mes">Las naves del mes</h1>
        
        
        <div class="contenedor-carros">
            
            
            <div class="card-carro">
                <img src="Imagenes/carro 1.png" alt="Carro 1">
                <h3>Carro toreto</h3>
                <p>Velocidad y potencia pura en carretera apenas pa volarse del reten.</p>
                <button class="btn-comprar">Ver Detalles</button>
            </div>

            
            <div class="card-carro">
                <img src="Imagenes/carro 2.png" alt="Carro 2">
                <h3>Camioneta Rayo </h3>
                <p>Inspirada en el campeon de la copa piston.</p>
                <button class="btn-comprar">Ver Detalles</button>
            </div>

            
            <div class="card-carro">
                <img src="Imagenes/carro 3.png" alt="Carro 3">
                <h3>Tesla 1829</h3>
                <p>El tesla avanzado de su epoca.</p>
                <button class="btn-comprar">Ver Detalles</button>
            </div>

        </div>
    </main>

</body>
</html>
