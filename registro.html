<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Regístrate - Rayo 95 Motors</title>
    <link rel="stylesheet" href="css/estilos.css">
</head>
<body class="nuevo-fondo"> 

    <div class="card">
        <h2>Crear Cuenta</h2>
        <p class="subtitle">Regístrate para acceder al sistema</p>

        <form action="catalogo.html" method="GET">
            <div class="form-group">
                <label for="nombre">Nombre completo:</label>
                <input type="text" id="nombre" name="nombre" required placeholder="Tu nombre">
            </div>

            <div class="form-group">
                <label for="correo">Correo electrónico:</label>
                <input type="email" id="correo" name="correo" required placeholder="correo@ejemplo.com">
            </div>

            <div class="form-group">
                <label for="password">Contraseña:</label>
                <input type="password" id="password" name="password" required placeholder="Crea una contraseña">
            </div>

            <button type="submit" class="btn">Registrarse</button>
        </form>

        <p class="links" style="text-align: center; margin-top: 20px;">
            <a href="index_admin.html" style="color: #FFFFFF; font-size: 13px; text-decoration: none;">¿Ya tienes cuenta? Inicia sesión</a>
        </p>
    </div>

</body>
</html>
